name: Publish AWCT interactive experiments
on:
  push:
    branches: [main]
    paths:
      - index.html
      - scripts/build-demos.py
      - .github/workflows/awct-site.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: awct-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout experiments and assets
        uses: actions/checkout@v4

      - name: Install Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build the four live static demos
        run: python3 scripts/build-demos.py

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static hub and four demos
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
